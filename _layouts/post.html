---
layout: homepage
---
<a class="life-back" href="/blog/">&larr; Blog</a>

<article class="post">
  <div class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%b %-d, %Y" }}</time>
      {%- if page.lang == "zh" %} · 中文{% endif %}
    </p>
  </div>

  <div class="post-body">
    {{ content }}
  </div>
</article>

{% if page.math %}
<!-- KaTeX 0.16.11, self-hosted (no CDN). kramdown only knows $$...$$: inline it emits \( \), on its own line \[ \]. Single $ is plain text. -->
<link rel="stylesheet" href="/assets/vendor/katex/katex.min.css">
<script defer src="/assets/vendor/katex/katex.min.js"></script>
<script defer src="/assets/vendor/katex/auto-render.min.js"
  onload="renderMathInElement(document.querySelector('.post-body'), {delimiters: [{left: '\\[', right: '\\]', display: true}, {left: '\\(', right: '\\)', display: false}], throwOnError: false});"></script>
{% endif %}
