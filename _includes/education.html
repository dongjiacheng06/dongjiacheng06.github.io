<h2 id="education">Education &amp; Experience</h2>
<div class="academic-timeline">
  <div class="academic-education">
    <h3 class="academic-label">Education</h3>
    <div class="education-period">
      <div class="education-years" aria-label="2024 to 2028, expected">
        <span>2028<small>expected</small></span><i aria-hidden="true"></i><span>2024</span>
      </div>
      <div class="education-summary">
        <div class="education-logos">
          <img src="{{ '/assets/images/logos/zju.svg' | relative_url }}" alt="Zhejiang University logo">
          <img src="{{ '/assets/images/logos/uiuc.png' | relative_url }}" alt="UIUC logo">
        </div>
        <h3>B.S. in Electrical Engineering</h3>
        <p>ZJU-UIUC Institute,<br>Zhejiang University</p>
        <p>{{ site.secondary_affiliation }}</p>
        <span class="degree-note">Dual Degree Program</span>
      </div>
    </div>
  </div>
  {% include experience.html %}
</div>
